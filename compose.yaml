name: alabuga
services:
  web:
    image: ${AF_WEB_IMAGE:-alabuga-web:local}
    ports: ["127.0.0.1:${AF_WEB_PORT:-4176}:8080"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    image: ${AF_API_IMAGE:-alabuga-api:local}
    environment:
      AF_OLLAMA_URL: ${AF_OLLAMA_URL:-http://ollama:11434}
      AF_AI_CONTEXT: ${AF_AI_CONTEXT:-4096}
      AF_ALLOWED_ORIGINS: ${AF_ALLOWED_ORIGINS:-http://127.0.0.1:4176,http://localhost:4176}
    volumes: ["ai-state:/state"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.35.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NO_CLOUD: "1"
    volumes: ["ollama-models:/root/.ollama"]
    gpus: all
    restart: unless-stopped
  model-init:
    profiles: ["ai"]
    image: ${AF_API_IMAGE:-alabuga-api:local}
    command: ["node", "bootstrap.js"]
    user: "0:0"
    mem_limit: 512m
    healthcheck:
      disable: true
    environment:
      AF_OLLAMA_URL: http://ollama:11434
      AF_OLLAMA_MODELS_DIR: /models/models
    volumes: ["ai-state:/state", "ollama-models:/models"]
    depends_on: ["ollama"]
    restart: "no"
volumes:
  ollama-models:
  ai-state:
