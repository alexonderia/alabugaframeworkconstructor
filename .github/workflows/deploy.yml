name: Constructor deploy
on:
  workflow_dispatch:
    inputs:
      version: {description: 'Existing Constructor release tag, for example v0.7.0', required: true}
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: constructor-production
    steps:
      - uses: actions/checkout@v4
      - name: Set up deployment SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.CONSTRUCTOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CONSTRUCTOR_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Select immutable release images
        env: {VERSION: '${{ inputs.version }}', GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-images.env
      - run: bash scripts/deploy.sh release-images.env
        env:
          CONSTRUCTOR_SSH_HOST: ${{ vars.CONSTRUCTOR_SSH_HOST }}
          CONSTRUCTOR_DEPLOY_DIR: ${{ vars.CONSTRUCTOR_DEPLOY_DIR }}
